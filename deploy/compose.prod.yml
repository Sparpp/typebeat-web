# Production stack for typebeat-web on a single Hetzner box.
#   cd /opt/typebeat-web && docker compose -f deploy/compose.prod.yml up -d --build
# Caddy terminates TLS for typebeat.mingda.sh and reverse-proxies to the app; the app talks to
# Postgres over the private compose network. Only Caddy publishes ports to the host.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Kestrel listens plain HTTP inside the network; Caddy does TLS.
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      TYPEBEAT_DB: "Host=postgres;Port=5432;Database=typebeat;Username=typebeat;Password=${POSTGRES_PASSWORD}"
      TYPEBEAT_BEHIND_PROXY: "true"
      # Empty disables Sentry entirely (see Program.cs).
      TYPEBEAT_SENTRY_DSN: "${TYPEBEAT_SENTRY_DSN:-}"
      # Normally unset; briefly "true" only while verifying Sentry capture.
      TYPEBEAT_ENABLE_DEBUG_THROW: "${TYPEBEAT_ENABLE_DEBUG_THROW:-}"
      # Uploaded beatmap packages/covers/previews (IFileStore root). Lives on the appdata
      # volume so container swaps keep the files; deploy/backup.sh tars it WEEKLY (cron lines
      # in the script header; they are not installed automatically).
      TYPEBEAT_FILE_ROOT: "/data"
      # Filename of the game-client release zip under {TYPEBEAT_FILE_ROOT}/downloads/, the
      # /download page's CTA. Set it in deploy/.env like the other TYPEBEAT_* keys (compose
      # does NOT forward undeclared host env vars; without this line an .env entry is
      # silently ignored and the page stays on "coming soon" forever). Empty = coming soon.
      TYPEBEAT_GAME_DOWNLOAD: "${TYPEBEAT_GAME_DOWNLOAD:-}"
      # Linux counterpart (the /download page's Linux card + /download/game-linux). The game
      # repo's build-linux.yml workflow always deploys the AppImage under the stable name
      # typebeat-linux.AppImage, so set TYPEBEAT_GAME_DOWNLOAD_LINUX once in deploy/.env.
      TYPEBEAT_GAME_DOWNLOAD_LINUX: "${TYPEBEAT_GAME_DOWNLOAD_LINUX:-}"
      # Email verification (M2). With a Resend API key the app sends real 6-digit codes; without
      # one it logs codes to the container log (docker logs typebeat-web-app-1) so verification
      # still works. See docs/email-setup.md for the one-time Resend + DNS setup. Empty = log mode.
      TYPEBEAT_RESEND_API_KEY: "${TYPEBEAT_RESEND_API_KEY:-}"
      # Sender identity for outgoing mail; must be on a Resend-verified domain. Empty falls back to
      # the app default "type!beat <noreply@mingda.sh>".
      TYPEBEAT_EMAIL_FROM: "${TYPEBEAT_EMAIL_FROM:-}"
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  # Server-side lyric alignment (torch/demucs, CPU). File-based job exchange with the app over
  # the shared appdata volume (/data/align-jobs, see AlignJobStore.cs + deploy/aligner/worker.py).
  # One job at a time by design; the memory cap keeps a demucs peak from starving postgres/app.
  aligner:
    build:
      context: .
      dockerfile: deploy/aligner/Dockerfile
    restart: unless-stopped
    volumes:
      - appdata:/data
    mem_limit: 5g
    cpus: 3

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: typebeat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: typebeat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typebeat"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  appdata:
