name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      # SUBMODULE_TOKEN: fine-grained PAT with read-only Contents on Sparpp/typebeat-web and
      # Sparpp/type-beat-assets (private). The game submodule Sparpp/typebeat is now public, so
      # it needs no explicit grant. checkout uses this token for the main repo and both submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # typebeat.Game requires the typebeat.Game.Resources package, which is too large to keep
      # in git (116 MB). Pack it from the assets submodule at exactly the version the game
      # demands, into the local feed declared in nuget.config.
      - name: Pack typebeat.Game.Resources into local feed
        run: |
          # sed, not grep -P: portable across locales, and guard against an empty match —
          # an empty -p:Version fails the pack with an opaque MSB4044.
          VER=$(sed -n 's/.*Include="typebeat.Game.Resources" Version="\([^"]*\)".*/\1/p' external/typebeat-osu/typebeat.Game/typebeat.Game.csproj)
          if [ -z "$VER" ]; then echo "::error::could not extract typebeat.Game.Resources version from the game csproj"; exit 1; fi
          echo "game requires typebeat.Game.Resources $VER"
          dotnet pack external/type-beat-assets/typebeat.Game.Resources/typebeat.Game.Resources.csproj \
            -c Release -o external/packages -p:PackageVersion="$VER" -p:Version="$VER"
          ls -la external/packages

      # The game submodule ships its own nuget.config: a dev-local feed with a Windows-style
      # relative path (..\type-beat-assets\artifacts) that doesn't resolve on the Linux CI layout
      # and hard-fails restore with NU1301. The web build vendors typebeat.Game.Resources through
      # this repo's own feed (external/packages, packed above), so drop the submodule's config and
      # restore purely from the root nuget.config — the same state CI had before the game repo
      # started tracking that file.
      - name: Drop game submodule's dev-local nuget.config
        run: rm -f external/typebeat-osu/nuget.config

      # PreviewGenerator (and the BSS upload flow) shell out to ffmpeg; the tests self-skip or
      # degrade without it, so install it to actually exercise the preview path (matches the
      # runtime image, which apt-installs ffmpeg too).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: dotnet build typebeat-web.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/Typebeat.Web.Tests -c Release --no-build

      # ServerFixture connects to localhost:5432 as postgres/postgres and creates its own
      # typebeat_wirecompat database — matches the service container above.
      - name: Wire-compat tests (against the client's own DTOs)
        run: dotnet test tests/Typebeat.WireCompat -c Release --no-build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production-deploy

    steps:
      - uses: actions/checkout@v4
        # no submodules: the image builds only src/Typebeat.Web; deploy ships the repo tree
        # minus external/ (see tar below), and deploy/.env on the box is never overwritten
        # because it is git-ignored and therefore absent from the checkout.

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # The key travels as single-line base64 (DEPLOY_SSH_KEY_B64): multiline private keys
          # pasted from Windows kept arriving mangled (CRLF/whitespace -> "error in libcrypto").
          # Base64 is immune to paste-transformations, and we validate the decoded key before
          # any connection attempt so a bad secret fails loudly here, not as an auth error.
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "deploy key parses OK"
          cp deploy/known_hosts ~/.ssh/known_hosts

      - name: Ship source to server
        run: |
          tar czf - --exclude=.git --exclude=external . \
            | ssh -i ~/.ssh/deploy_key root@46.62.142.5 'tar xzf - -C /opt/typebeat-web && chmod +x /opt/typebeat-web/deploy/up.sh'
          # up.sh is executable in git (mode 100755) now, but the chmod stays: the first
          # deploy after it was committed (as 100644) shipped it over the box's executable copy and
          # every later step died with "Permission denied" (2026-09-30).

      # Rollback point (backlog 368): tag the image the RUNNING container was created from as
      # typebeat-web-app:previous, before the build below moves the typebeat-web-app tag onto the
      # new image. Taken from the container (not from the tag) so it is always what is actually
      # serving, including after an earlier rollback. Exactly one extra tagged image: retagging
      # leaves the one before it dangling, and the prune at the end collects that on a green run,
      # while `docker image prune -f` never removes a tagged image. No container (a fresh box) is
      # not an error, there is just nothing to roll back to.
      - name: Keep the running image as previous
        run: |
          ssh -i ~/.ssh/deploy_key root@46.62.142.5 'id=$(docker inspect --format "{{.Image}}" typebeat-web-app-1 2>/dev/null)             && docker tag "$id" typebeat-web-app:previous && echo "kept $id as typebeat-web-app:previous"             || echo "no running app container, nothing to keep"'

      # Gate: build the image BEFORE touching the running container, so a broken build
      # never takes production down (learned the hard way).
      - name: Build image on server
        run: ssh -i ~/.ssh/deploy_key root@46.62.142.5 'cd /opt/typebeat-web && ./deploy/up.sh build app'

      - name: Swap container
        id: swap
        run: ssh -i ~/.ssh/deploy_key root@46.62.142.5 'cd /opt/typebeat-web && ./deploy/up.sh up -d app'

      # Caddyfile changes used to never reach the running container (backlog 190): the old
      # single-file bind held the pre-deploy inode, and nothing here ever touched caddy. Now:
      # `up -d caddy` recreates the container only when its compose definition changed (which is
      # also how the directory-mount change itself rolls out), and the graceful `caddy reload`
      # picks up Caddyfile content changes with zero downtime (a no-op when nothing changed or
      # the container was just recreated).
      - name: Reload caddy config
        run: |
          ssh -i ~/.ssh/deploy_key root@46.62.142.5 'cd /opt/typebeat-web \
            && ./deploy/up.sh up -d caddy \
            && ./deploy/up.sh exec -T caddy caddy reload --config /etc/caddy/deploy/Caddyfile --adapter caddyfile'

      # AFTER the caddy reload on purpose. The check goes through Caddy, so a deploy that changes
      # which hostnames Caddy serves can only pass once the reload has happened: the deploy that
      # moved the site to typebeat.sh checked the new name first, got Cloudflare 525s because Caddy
      # had no vhost for it yet, failed, and so skipped the very reload that would have fixed it.
      # The old host is checked too, since every client shipped before the move still talks to it.
      # PATIENT on purpose, although less needed since backlog 368: the deploy that carried
      # LyricPace v22 took well over the old 35 s window (5 s + 10 x 3 s) because the app did not
      # listen until Program.cs had run the migrations AND every backfill sweep (PaceBackfill
      # re-rates EVERY ranked map whenever LyricPace's VERSION moves, about 0.3 to 0.65 s per map);
      # Caddy answered 502 throughout, this step went red and the cleanup steps below never ran,
      # although the site came up healthy a minute later (2026-09-30). Since backlog 368 only the
      # migrations run before the app listens; the sweeps run in the StartupSweeps hosted service
      # behind a gate (BSS package ingest and the rank button answer 503 until it opens), and
      # /health is liveness, so it answers as soon as the app is up. The six-minute window stays
      # until a deploy has proved that, then it can shrink back toward 35 s. A genuinely broken
      # container still fails here, and the Roll back step below then restores the previous image.
      # The body is "ok", or "degraded: ..." (still 200) while the app's disk guard refuses writes
      # (backlog 365, DiskGuard.HealthBody): a deploy onto a nearly full disk has still deployed, and
      # UptimeRobot's "ok" keyword monitor is what alerts on the degraded state.
      - name: Health check
        id: health
        run: |
          sleep 5
          curl -fsS --retry 60 --retry-delay 5 --retry-max-time 360 --retry-all-errors https://typebeat.sh/health | grep -qE '^(ok|degraded)'
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors https://typebeat.mingda.sh/health | grep -qE '^(ok|degraded)'
          echo "healthy"

      # Automatic rollback (backlog 368), ONLY when the swap or the health check itself failed (a
      # failed swap may already have removed the old container). A red build or a failed caddy
      # reload does not trigger it (an earlier step failing skips the later ones, whose outcome is
      # then "skipped", not "failure"), and those leave the running app alone. It prints
      # the failing container's last log lines, points typebeat-web-app back at :previous and
      # recreates ONLY the app (--no-build, because the app has a build section and up would
      # otherwise rebuild the broken source; --no-deps, so postgres and caddy are untouched), then
      # re-checks health. The job stays red either way: a rollback is a failed deploy.
      # Limits (deploy/README.md, "Rollback"): migrations are forward-only, so this is safe only
      # when the failed deploy's migrations were additive (the old binary skips names it does not
      # know but runs against the newer schema); a GameplayFingerprint VERSION bump makes the
      # rollback re-sweep the whole catalogue (and the next good deploy re-sweep it again); the
      # Caddyfile is NOT rolled back.
      - name: Roll back to the previous image
        if: failure() && (steps.health.outcome == 'failure' || steps.swap.outcome == 'failure')
        run: |
          ssh -i ~/.ssh/deploy_key root@46.62.142.5 'cd /opt/typebeat-web             && echo "--- last log lines of the failing container ---"             && { docker logs --tail 150 typebeat-web-app-1 2>&1 || true; }             && docker image inspect typebeat-web-app:previous >/dev/null             && docker tag typebeat-web-app:previous typebeat-web-app             && ./deploy/up.sh up -d --no-build --no-deps --force-recreate app'
          sleep 5
          curl -fsS --retry 60 --retry-delay 5 --retry-max-time 360 --retry-all-errors https://typebeat.sh/health | grep -qE '^(ok|degraded)'
          echo "rolled back to typebeat-web-app:previous and it is healthy; this deploy still FAILED"

      # The build cache is what the box pays for the app image build, and nothing ever collected
      # it: on 2026-09-04 it had reached 7 GB and helped fill the 75 GB disk (see deploy/README.md,
      # "Disk"). Pruned LAST, after the build, so every layer this deploy could reuse was still
      # there when it mattered; the cost is that the next deploy rebuilds from the image layers
      # rather than the build cache, which is seconds on the app. Deliberately in CI and not in
      # deploy/up.sh: that script is the thin compose wrapper the box runs, and a prune belongs
      # with the deploy that made the layers, not with every compose call.
      - name: Prune docker build cache
        run: ssh -i ~/.ssh/deploy_key root@46.62.142.5 'docker builder prune -f'

      # The disk filled a SECOND time on 2026-09-26, and this is the growth the first round of
      # guards (backlog 268) never covered. Every deploy rebuilds the app image and MOVES the
      # typebeat-web-app tag onto the new one, which leaves the previous image behind as a
      # dangling <none>. `docker builder prune` above does not touch images, nothing else on the
      # box collects them, and their `restart: unless-stopped` containers are long gone, so they
      # accumulate one per push to main, forever, on the ROOT filesystem.
      #
      # The step above makes that worse rather than better, which is why they are adjacent: with
      # the build cache wiped, the next deploy re-runs the Dockerfile's `apt-get install ffmpeg`
      # from scratch instead of reusing a cached layer, so the new image's base layers get FRESH
      # digests and stop being shared with the old dangling one. Each leaked image then holds its
      # own full copy (the apt layer is the bulk of it) rather than just the published-app diff.
      #
      # Dangling only: no `-a`, so nothing tagged is ever removed (the retired aligner image is
      # tagged, so it survives for the owner to remove deliberately, per deploy/README.md; so does
      # typebeat-web-app:previous, the one rollback point the step before the build keeps), and an
      # image a container still uses cannot be pruned at all. Runs LAST, after the health check
      # and the caddy reload, so the image this deploy is actually serving from is tagged and in
      # use by then.
      - name: Prune dangling docker images
        run: ssh -i ~/.ssh/deploy_key root@46.62.142.5 'docker image prune -f'
