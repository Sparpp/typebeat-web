version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/Typebeat.Web
      - /tests/Typebeat.Web.Tests
      - /tests/Typebeat.WireCompat
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
